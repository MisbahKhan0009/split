<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    *{box-sizing:border-box}body{margin:0}.slide-container{width:1280px;min-height:720px;position:relative;background:radial-gradient(circle at 20% 80%,rgba(141,216,255,.08),transparent 30%),#080d16;color:#edf3f8;font-family:'DM Sans',sans-serif;padding:58px 70px 0;overflow:hidden}
    .top{display:flex;justify-content:space-between}.kicker{color:#b7f36b;font-size:10px;letter-spacing:.18em;font-weight:700}.num{color:#5c6d78;font:600 11px 'Space Grotesk'}
    .headline{margin:21px 0 0;font:600 54px/.98 'Space Grotesk';letter-spacing:-.08em;max-width:400px}.headline em{color:#b7f36b;font-style:normal}
    .bottom-label{position:absolute;bottom:80px;left:70px;color:#91a4ad;font-size:14px;line-height:1.6;max-width:300px;border-left:2px solid #b7f36b;padding-left:15px}
    .visual-area{position:absolute;right:40px;top:100px;width:800px;height:540px}
    .screen-frame{width:100%;height:100%;border:1px solid rgba(220,240,237,.15);border-radius:16px;background:linear-gradient(135deg,rgba(46,65,76,.5),rgba(11,20,29,.6));box-shadow:0 30px 80px rgba(0,0,0,.5);padding:8px}
    .screen{width:100%;height:100%;border-radius:10px;object-fit:cover;object-position:top left;display:block}
    .callout{position:absolute;display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid rgba(183,243,107,.3);border-radius:12px;background:rgba(17,31,45,.9);box-shadow:0 15px 35px rgba(0,0,0,.3);color:#e8f1ee;font-size:12px;font-weight:500;z-index:10}
    .callout .c-num{display:grid;place-items:center;width:24px;height:24px;border-radius:6px;background:#b7f36b;color:#142212;font:700 11px 'Space Grotesk'}
    .callout:after{content:'';position:absolute;width:30px;height:1px;background:#b7f36b}
    .c1{top:180px;left:-60px}.c1:after{right:-30px;top:50%}
    .c2{top:250px;right:-40px}.c2:after{left:-30px;top:50%}
    .c3{bottom:120px;left:-40px}.c3:after{right:-30px;top:50%}
    .footer{position:absolute;left:70px;right:70px;bottom:22px;display:flex;justify-content:space-between;color:#53636e;font-size:9px;letter-spacing:.12em;text-transform:uppercase}
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="top"><div class="kicker">THE EXPERIENCE / ACTIONABLE DATA</div><div class="num">03</div></div>
    <h1 class="headline">Every number<br><em>is an action.</em></h1>
    <div class="bottom-label">Quiet interface.<br>Immediate next step.</div>
    
    <div class="visual-area">
      <div class="screen-frame">
        <img class="screen" src="/home/ubuntu/screenshots/localhost_2026-08-16_19-21-41_5975.webp" alt="SplitWise+ Workspace">
      </div>
      <div class="callout c1"><div class="c-num">01</div> Understand the balance.</div>
      <div class="callout c2"><div class="c-num">02</div> Inspect the spend.</div>
      <div class="callout c3"><div class="c-num">03</div> Continue the conversation.</div>
    </div>

    <div class="footer"><span>SplitWise+ / Stakeholder preview</span><span>Product experience</span></div>
  </div>
</body>
</html>
