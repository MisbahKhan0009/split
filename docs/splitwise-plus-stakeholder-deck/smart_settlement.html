<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    *{box-sizing:border-box}
    body{margin:0}
    .slide-container{width:1280px;min-height:720px;position:relative;background:radial-gradient(circle at 50% 50%,rgba(183,243,107,.05),transparent 40%),#080d16;color:#edf3f8;font-family:'DM Sans',sans-serif;padding:58px 70px 0}
    .top{display:flex;justify-content:space-between;align-items:flex-start}
    .kicker,.label{color:#b7f36b;font-size:10px;letter-spacing:.18em;font-weight:700}
    .headline{margin:21px 0 0;font:600 57px/.98 'Space Grotesk';letter-spacing:-.08em;max-width:800px}
    .headline em{font-style:normal;color:#b7f36b}
    
    .comparison-area{display:flex;align-items:center;justify-content:space-between;margin-top:70px;position:relative}
    .panel{width:460px;height:340px;padding:35px;border:1px solid rgba(190,220,222,.15);border-radius:20px;background:linear-gradient(140deg,rgba(29,43,55,.6),rgba(14,24,35,.4));box-shadow:0 24px 60px rgba(0,0,0,.2)}
    .panel.after{border-color:rgba(183,243,107,.25);background:linear-gradient(140deg,rgba(37,59,48,.6),rgba(14,24,35,.4))}
    
    .panel-title{color:#91a4ad;font-size:11px;letter-spacing:.15em;font-weight:700;margin-bottom:30px;text-transform:uppercase}
    .after .panel-title{color:#b7f36b}
    
    .transfer-list{display:flex;flex-direction:column;gap:16px}
    .transfer{display:flex;align-items:center;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid rgba(190,220,222,.08)}
    .transfer:last-child{border-bottom:none;padding-bottom:0}
    
    .nodes{display:flex;align-items:center;gap:12px}
    .node{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:#1b2a34;color:#9aacb2;font-size:11px;font-weight:700}
    .after .node{background:rgba(183,243,107,.15);color:#b7f36b}
    .line{width:40px;height:1px;background:#4b5e65;position:relative}
    .after .line{background:rgba(183,243,107,.4)}
    .line::after{content:'';position:absolute;right:0;top:-3px;border-top:3px solid transparent;border-bottom:3px solid transparent;border-left:4px solid #4b5e65}
    .after .line::after{border-left-color:rgba(183,243,107,.6)}
    
    .amount{font:600 16px 'Space Grotesk';color:#d7e4e4}
    .after .amount{color:#fff}
    
    .center-metric{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;text-align:center;width:180px}
    .center-metric .big-number{font:700 110px/.8 'Space Grotesk';color:#b7f36b;letter-spacing:-.05em;text-shadow:0 0 40px rgba(183,243,107,.3)}
    .center-metric .caption{margin-top:12px;color:#91a4ad;font-size:13px;line-height:1.4}
    
    .chip{position:absolute;right:70px;bottom:80px;padding:12px 18px;border-radius:999px;border:1px solid rgba(183,243,107,.2);background:rgba(29,56,43,.6);color:#b7f36b;font-size:10px;letter-spacing:.1em;font-weight:700;text-transform:uppercase}
    
    .footer{position:absolute;left:70px;right:70px;bottom:22px;display:flex;justify-content:space-between;color:#53636e;font-size:9px;letter-spacing:.12em;text-transform:uppercase}
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="top">
      <div class="kicker">SMART SETTLEMENT</div>
      <div class="label">06</div>
    </div>
    <h1 class="headline">Fewer payments.<br><em>More moving on.</em></h1>
    
    <div class="comparison-area">
      <div class="panel before">
        <div class="panel-title">Before</div>
        <div class="transfer-list">
          <div class="transfer"><div class="nodes"><div class="node">A</div><div class="line"></div><div class="node">B</div></div><div class="amount">৳ 340</div></div>
          <div class="transfer"><div class="nodes"><div class="node">B</div><div class="line"></div><div class="node">C</div></div><div class="amount">৳ 620</div></div>
          <div class="transfer"><div class="nodes"><div class="node">A</div><div class="line"></div><div class="node">C</div></div><div class="amount">৳ 210</div></div>
          <div class="transfer"><div class="nodes"><div class="node">C</div><div class="line"></div><div class="node">D</div></div><div class="amount">৳ 180</div></div>
          <div class="transfer"><div class="nodes"><div class="node">A</div><div class="line"></div><div class="node">D</div></div><div class="amount">৳ 100</div></div>
        </div>
      </div>
      
      <div class="center-metric">
        <div class="big-number">3</div>
        <div class="caption">payments<br>instead of 5</div>
      </div>
      
      <div class="panel after">
        <div class="panel-title">After optimization</div>
        <div class="transfer-list" style="margin-top: 25px; gap: 28px;">
          <div class="transfer"><div class="nodes"><div class="node">A</div><div class="line"></div><div class="node">C</div></div><div class="amount">৳ 190</div></div>
          <div class="transfer"><div class="nodes"><div class="node">B</div><div class="line"></div><div class="node">C</div></div><div class="amount">৳ 430</div></div>
          <div class="transfer"><div class="nodes"><div class="node">C</div><div class="line"></div><div class="node">D</div></div><div class="amount">৳ 180</div></div>
        </div>
      </div>
    </div>
    
    <div class="chip">request &middot; confirm &middot; close the loop</div>
    
    <div class="footer">
      <span>SplitWise+ / Stakeholder preview</span>
      <span>Smart settlement</span>
    </div>
  </div>
</body>
</html>
